<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Home Base Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary:    #faf6f0;
    --bg-secondary:  #ffffff;
    --bg-card:       #fffdfa;
    --accent-matcha: #8fb83d;
    --accent-coral:  #ef8378;
    --accent-teal:   #4fb3a6;
    --text-dark:     #2b2b2b;
    --text-body:     #4a4a4a;
    --text-muted:    #998c78;
    --line:          #ece3d6;
    --font-display:  'Fraunces', serif;
    --font-body:     'Space Grotesk', sans-serif;
    --font-mono:     'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--bg-primary);
    color: var(--text-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #root {
    background:
      radial-gradient(circle at 12% 18%, rgba(143,184,61,0.06), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(239,131,120,0.06), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(79,179,166,0.06), transparent 50%),
      var(--bg-primary);
    min-height: 100vh;
  }

  .holo-text {
    background: linear-gradient(110deg,
      #8fb83d 0%, #4fb3a6 22%, #5ba8d6 40%,
      #ef8378 58%, #b98fd6 74%, #8fb83d 100%);
    background-size: 280% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: holoShift 7s linear infinite;
    filter: saturate(1.15);
  }

  @keyframes holoShift {
    0%   { background-position: 0% 50%; }
    100% { background-position: 280% 50%; }
  }

  .holo-btn {
    position: relative;
    border: none;
    cursor: pointer;
    font-family: var(--font-mono);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.8rem;
    color: #ffffff;
    padding: 14px 28px;
    border-radius: 14px;
    background: linear-gradient(110deg,
      #8fb83d, #4fb3a6, #5ba8d6, #ef8378, #b98fd6, #8fb83d);
    background-size: 280% 100%;
    animation: holoShift 7s linear infinite;
    box-shadow: 0 6px 18px rgba(79,179,166,0.28);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    text-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }
  .holo-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 10px 28px rgba(239,131,120,0.4);
  }
  .holo-btn:active { transform: scale(0.98); }
  .holo-btn:disabled { opacity: 0.45; cursor: not-allowed; animation: none; }

  .ghost-btn {
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 10px 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .ghost-btn:hover { border-color: var(--accent-teal); color: var(--accent-teal); }

  .eyebrow {
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.72rem;
    font-weight: 500;
  }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; }

  .hero { padding: 80px 0 50px; text-align: center; }
  .hero h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 14px 0 18px;
  }
  .hero h1 em { font-style: italic; font-weight: 400; }
  .hero p {
    max-width: 560px; margin: 0 auto;
    font-size: 1.08rem; line-height: 1.6; color: var(--text-body);
  }

  .progress-bar {
    height: 8px; width: 100%; background: var(--line);
    border-radius: 99px; overflow: hidden; margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #8fb83d, #4fb3a6, #ef8378);
    background-size: 200% 100%; animation: holoShift 7s linear infinite;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 34px;
    box-shadow: 0 8px 30px rgba(43,43,43,0.05);
  }

  .pillar-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 14px; margin: 26px 0;
  }
  .pillar {
    text-align: left; cursor: pointer;
    border: 1.5px solid var(--line); border-radius: 16px;
    padding: 20px; background: var(--bg-secondary);
    transition: all 0.22s ease;
  }
  .pillar:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(43,43,43,0.08); }
  .pillar.active { border-color: transparent; box-shadow: 0 0 0 2px var(--p-color), 0 12px 26px rgba(43,43,43,0.1); }
  .pillar .ico { font-size: 1.8rem; margin-bottom: 10px; }
  .pillar h3 { font-family: var(--font-display); font-size: 1.25rem; color: var(--text-dark); margin-bottom: 6px; }
  .pillar p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.45; }

  .step-q { font-family: var(--font-display); font-size: 1.55rem; color: var(--text-dark); line-height: 1.25; margin-bottom: 8px; }
  .step-hint { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }

  textarea, input[type=text] {
    width: 100%; font-family: var(--font-body); font-size: 1rem;
    color: var(--text-dark); background: var(--bg-secondary);
    border: 1.5px solid var(--line); border-radius: 14px;
    padding: 14px 16px; resize: vertical; min-height: 90px;
    transition: border-color 0.2s ease;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent-teal); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .chip {
    font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.04em;
    padding: 9px 15px; border-radius: 99px; border: 1.5px solid var(--line);
    background: var(--bg-secondary); cursor: pointer; color: var(--text-body);
    transition: all 0.18s ease;
  }
  .chip:hover { border-color: var(--accent-coral); }
  .chip.sel { background: var(--accent-teal); border-color: var(--accent-teal); color: #fff; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 12px; }

  .plan-section { margin-bottom: 26px; }
  .plan-section .ph { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .plan-section .ph .dot { width: 12px; height: 12px; border-radius: 50%; }
  .plan-section .ph h3 { font-family: var(--font-display); font-size: 1.4rem; color: var(--text-dark); }
  .plan-block {
    background: var(--bg-secondary); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
  }
  .plan-block .lbl { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 6px; }
  .plan-block .val { color: var(--text-dark); line-height: 1.55; white-space: pre-wrap; }

  .footer { text-align: center; padding: 40px 0 60px; }
  .footer a { color: var(--accent-teal); text-decoration: none; font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.08em; }
  .footer a:hover { text-decoration: underline; }

  .tag-line { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }

  @keyframes sparkleAnim {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(0.2) rotate(180deg) translateY(-20px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  'use strict';

  // ---------- Data ----------
  var PILLARS = [
    { id: 'physical', ico: '🏠', color: '#8fb83d', title: 'Physical Space',
      blurb: 'Make the walls feel like yours, not a rental you are passing through.' },
    { id: 'emotional', ico: '🌱', color: '#ef8378', title: 'Emotional Roots',
      blurb: 'Build the felt sense of belonging, not just the address.' },
    { id: 'practical', ico: '🧭', color: '#4fb3a6', title: 'Practical Anchors',
      blurb: 'The boring stuff that quietly makes a place liveable.' }
  ];

  var STEPS = {
    physical: [
      { q: 'What one corner of your space feels the least like you?', hint: 'Name it specifically. The kitchen counter, the entryway, the bedroom wall.', type: 'text' },
      { q: 'What is a small object that would make it feel claimed?', hint: 'A plant, a photo, a candle, a rug. Something you would actually buy this week.', type: 'text' },
      { q: 'Which senses are missing from your space right now?', hint: 'Pick what is absent. You will add it back.', type: 'chips',
        options: ['Scent', 'Warm light', 'Sound / music', 'Soft textures', 'Greenery', 'Color'] }
    ],
    emotional: [
      { q: 'When do you feel most like a guest in your own life here?', hint: 'A moment, a time of day, a recurring feeling.', type: 'text' },
      { q: 'What did "home" smell, sound, or feel like before you moved?', hint: 'You are not recreating the past. You are naming the thread to keep.', type: 'text' },
      { q: 'What helps you feel rooted?', hint: 'Choose what is true for you, not what should be.', type: 'chips',
        options: ['Routine', 'People nearby', 'Nature access', 'Familiar food', 'A creative practice', 'Faith / ritual'] }
    ],
    practical: [
      { q: 'What is the one logistics thing still making you feel unsettled?', hint: 'Bank, doctor, phone plan, finding your grocery store. The nagging undone thing.', type: 'text' },
      { q: 'Who or what is your closest local anchor point?', hint: 'A person, a cafe, a gym, a park. Your "if all else fails, I go here".', type: 'text' },
      { q: 'Which anchors do you still need to build?', hint: 'Be honest about the gaps.', type: 'chips',
        options: ['A regular spot', 'A local friend', 'A movement habit', 'A weekly ritual', 'A go-to meal', 'A green space'] }
    ]
  };

  // ---------- State ----------
  var state = {
    phase: 'intro', // intro | build | plan
    pillar: null,
    stepIdx: 0,
    answers: { physical: {}, emotional: {}, practical: {} },
    done: { physical: false, emotional: false, practical: false }
  };

  var root = document.getElementById('root');

  // ---------- Helpers ----------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'style') node.setAttribute('style', attrs[k]);
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else if (k.indexOf('data-') === 0 || k === 'placeholder' || k === 'href' || k === 'target' || k === 'rel') node.setAttribute(k, attrs[k]);
        else node[k] = attrs[k];
      });
    }
    if (children != null) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c == null) return;
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return node;
  }

  function pillarById(id) {
    for (var i = 0; i < PILLARS.length; i++) if (PILLARS[i].id === id) return PILLARS[i];
    return null;
  }

  function fmt(v) {
    if (Array.isArray(v)) return v.join(', ') || '—';
    return v || '—';
  }

  function completedCount() {
    return [state.done.physical, state.done.emotional, state.done.practical].filter(Boolean).length;
  }

  // ---------- Render ----------
  function render() {
    root.innerHTML = '';
    var wrap = el('div', { class: 'wrap' });

    // Hero
    var hero = el('div', { class: 'hero' }, [
      el('div', { class: 'eyebrow holo-text' }, 'Aligned Expat Roots'),
      el('h1', { html: 'The <em>Home Base</em><br>Builder' }),
      el('p', null, 'Stop feeling like a permanent guest in your own life. Build a real sense of home in your new place — physically, emotionally, and practically.')
    ]);
    wrap.appendChild(hero);

    // Progress
    var count = completedCount();
    var overallPct = state.phase === 'plan' ? 100 : Math.round((count / 3) * 100);
    if (state.phase !== 'intro' || count > 0) {
      var prog = el('div', { style: 'margin-bottom:24px;' }, [
        el('div', { class: 'progress-bar' }, el('div', { class: 'progress-fill', style: 'width:' + overallPct + '%;' })),
        el('div', { class: 'tag-line' }, overallPct + '% rooted · ' + count + ' of 3 pillars built')
      ]);
      wrap.appendChild(prog);
    }

    if (state.phase === 'intro') wrap.appendChild(renderIntro());
    else if (state.phase === 'build') wrap.appendChild(renderBuild());
    else if (state.phase === 'plan') wrap.appendChild(renderPlan());

    // Footer
    wrap.appendChild(el('div', { class: 'footer' }, [
      el('div', { class: 'tag-line', style: 'margin-bottom:10px;' }, 'You are not a guest here. You live here.'),
      el('a', { href: 'https://skool.com/earthway-sanctuary-3366/about', target: '_blank', rel: 'noopener' }, 'JOIN THE COMMUNITY →')
    ]));

    root.appendChild(wrap);
  }

  function renderIntro() {
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'eyebrow', style: 'color:var(--accent-teal);margin-bottom:6px;' }, 'Pick a pillar'));
    card.appendChild(el('p', { style: 'color:var(--text-muted);margin-bottom:4px;' }, 'Build them in any order. Come back for the next one whenever.'));

    var grid = el('div', { class: 'pillar-grid' });
    PILLARS.forEach(function (p) {
      var isDone = state.done[p.id];
      var tile = el('div', {
        class: 'pillar' + (isDone ? ' active' : ''),
        style: '--p-color:' + p.color + ';',
        onClick: function () { startPillar(p.id); }
      }, [
        el('div', { class: 'ico' }, p.ico),
        el('h3', null, p.title),
        el('p', null, p.blurb),
        el('div', { class: 'tag-line', style: 'margin-top:12px;' },
          isDone ? el('span', { style: 'color:' + p.color + ';' }, '✓ Built — tap to revisit') : 'Tap to begin →')
      ]);
      grid.appendChild(tile);
    });
    card.appendChild(grid);

    var count = completedCount();
    if (count === 3) {
      card.appendChild(el('div', { style: 'text-align:center;margin-top:10px;' },
        el('button', { class: 'holo-btn', onClick: function () { state.phase = 'plan'; render(); } }, 'See my Home Base plan')));
    } else if (count > 0) {
      card.appendChild(el('div', { style: 'text-align:center;margin-top:10px;' },
        el('button', { class: 'ghost-btn', onClick: function () { state.phase = 'plan'; render(); } }, 'Preview plan so far')));
    }
    return card;
  }

  function renderBuild() {
    var steps = STEPS[state.pillar];
    var cur = steps[state.stepIdx];
    var p = pillarById(state.pillar);
    var curAns = state.answers[state.pillar][state.stepIdx];
    var answered = cur.type === 'chips' ? (curAns && curAns.length) : (curAns && curAns.trim());

    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'eyebrow', style: 'color:' + p.color + ';margin-bottom:14px;' },
      p.title + ' · Step ' + (state.stepIdx + 1) + ' of ' + steps.length));
    card.appendChild(el('div', { class: 'step-q' }, cur.q));
    card.appendChild(el('div', { class: 'step-hint' }, cur.hint));

    if (cur.type === 'text') {
      var ta = el('textarea', {
        placeholder: 'Write it down. Specific beats tidy.',
        onInput: function (e) { state.answers[state.pillar][state.stepIdx] = e.target.value; updateNavState(); }
      });
      ta.value = curAns || '';
      card.appendChild(ta);
      setTimeout(function () { ta.focus(); }, 0);
    } else {
      var row = el('div', { class: 'chip-row' });
      cur.options.forEach(function (opt) {
        var sel = (curAns || []).indexOf(opt) !== -1;
        row.appendChild(el('div', {
          class: 'chip' + (sel ? ' sel' : ''),
          onClick: function () { toggleChip(opt); }
        }, opt));
      });
      card.appendChild(row);
    }

    var nextLabel = state.stepIdx < steps.length - 1 ? 'Next' : 'Finish pillar';
    var nextBtn = el('button', { class: 'holo-btn', onClick: nextStep }, nextLabel);
    if (!answered) nextBtn.disabled = true;
    nextBtn.setAttribute('data-next', '1');

    card.appendChild(el('div', { class: 'nav-row' }, [
      el('button', { class: 'ghost-btn', onClick: prevStep }, '← Back'),
      nextBtn
    ]));
    return card;
  }

  function updateNavState() {
    var steps = STEPS[state.pillar];
    var cur = steps[state.stepIdx];
    var curAns = state.answers[state.pillar][state.stepIdx];
    var answered = cur.type === 'chips' ? (curAns && curAns.length) : (curAns && curAns.trim());
    var btn = root.querySelector('[data-next]');
    if (btn) btn.disabled = !answered;
  }

  function renderPlan() {
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'eyebrow holo-text', style: 'margin-bottom:6px;' }, 'Your blueprint'));
    card.appendChild(el('h2', {
      style: 'font-family:var(--font-display);font-size:2rem;color:var(--text-dark);margin-bottom:20px;',
      html: 'Your <em style="font-style:italic;font-weight:400;">Home Base</em> plan'
    }));

    PILLARS.forEach(function (p) {
      var section = el('div', { class: 'plan-section' });
      section.appendChild(el('div', { class: 'ph' }, [
        el('span', { class: 'dot', style: 'background:' + p.color + ';' }),
        el('h3', null, p.ico + ' ' + p.title)
      ]));

      if (state.done[p.id]) {
        STEPS[p.id].forEach(function (s, i) {
          section.appendChild(el('div', { class: 'plan-block' }, [
            el('div', { class: 'lbl' }, s.q),
            el('div', { class: 'val' }, fmt(state.answers[p.id][i]))
          ]));
        });
      } else {
        section.appendChild(el('div', { class: 'plan-block' },
          el('div', { class: 'val', style: 'color:var(--text-muted);' }, 'Not built yet. Head back and tackle this one.')));
      }
      card.appendChild(section);
    });

    card.appendChild(el('div', { class: 'nav-row', style: 'justify-content:center;flex-wrap:wrap;' }, [
      el('button', { class: 'ghost-btn', onClick: function () { state.phase = 'intro'; render(); } }, '← Back to pillars'),
      el('button', { class: 'holo-btn', onClick: function () { window.print(); } }, 'Save / print my plan')
    ]));
    return card;
  }

  // ---------- Actions ----------
  function startPillar(id) {
    state.pillar = id; state.stepIdx = 0; state.phase = 'build'; render();
  }
  function toggleChip(opt) {
    var cur = state.answers[state.pillar][state.stepIdx] || [];
    var idx = cur.indexOf(opt);
    if (idx !== -1) cur = cur.filter(function (x) { return x !== opt; });
    else cur = cur.concat([opt]);
    state.answers[state.pillar][state.stepIdx] = cur;
    render();
  }
  function nextStep() {
    var steps = STEPS[state.pillar];
    if (state.stepIdx < steps.length - 1) { state.stepIdx++; }
    else { state.done[state.pillar] = true; state.phase = 'intro'; state.pillar = null; }
    render();
  }
  function prevStep() {
    if (state.stepIdx > 0) { state.stepIdx--; }
    else { state.phase = 'intro'; state.pillar = null; }
    render();
  }

  // ---------- Sparkle trail ----------
  var sparkleColors = ['#8fb83d', '#ef8378', '#4fb3a6', '#5ba8d6', '#b98fd6'];
  var lastSparkle = 0;
  document.addEventListener('mousemove', function (e) {
    var now = Date.now();
    if (now - lastSparkle < 45) return;
    lastSparkle = now;
    var s = document.createElement('div');
    var c = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
    var size = Math.random() * 7 + 4;
    s.style.cssText = 'position:fixed;left:' + e.clientX + 'px;top:' + e.clientY + 'px;width:' + size + 'px;height:' + size + 'px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);background:' + c + ';clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:sparkleAnim 0.7s ease-out forwards;';
    document.body.appendChild(s);
    setTimeout(function () { s.remove(); }, 700);
  });

  // ---------- Boot ----------
  render();
})();
</script>
</body>
</html>
